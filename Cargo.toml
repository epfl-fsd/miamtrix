[package]
name = "miamtrix"
version = "1.7.0"
edition = "2024"
repository = "https://github.com/epfl-fsd/miamtrix"

[dependencies]
anyhow = "1.0.102"
chrono = "0.4.44"
deunicode = "1.6.2"
diesel = { version = "2.1.0", features = ["postgres", "chrono"] }
diesel_migrations = { version = "2.1.0", features = ["postgres"] }
deadpool-diesel = { version = "0.5", features = ["postgres", "rt_tokio_1"] }
diesel-async = { version = "0.4", features = ["postgres", "deadpool"] }
dotenv = "0.15.0"
http = "1.4.0"
matrix-sdk = { version = "0.16.0", default-features = false, features = [
    "rustls-tls",
    "e2e-encryption",
    "markdown"
] }
petname = "2.0.2"
regex = { version = "1"}
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full"] }
tokio-cron-scheduler = { version = "0.10.2" }
chrono-tz = "0.10.4"
log = "0.4.29"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.4"
